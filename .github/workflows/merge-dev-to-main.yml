name: Merge dev to main

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.0
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Merge with conflict resolution (Accept dev)
        run: |
          git fetch origin
          git checkout main
          git merge origin/dev -X theirs --no-ff -m "Merge dev into main [automated - conflicts resolved]" || true

      - name: Push changes
        run: git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
